name: hithink finance Python CI

on:
  pull_request:
    paths:
      - python/**
      - docs/api/**
      - docs/mcp.md
      - docs/mcp/**
      - skills/hithink-finance/**
      - scripts/sync_skill_contracts.py
      - .github/workflows/hithink-finance-python-ci.yml
  push:
    paths:
      - python/**
      - docs/api/**
      - docs/mcp.md
      - docs/mcp/**
      - skills/hithink-finance/**
      - scripts/sync_skill_contracts.py
      - .github/workflows/hithink-finance-python-ci.yml

jobs:
  verify-python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "./python[dev]"
      - run: python -m pytest python/tests/ -q
      - run: python scripts/sync_skill_contracts.py --check
