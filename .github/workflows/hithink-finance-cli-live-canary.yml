name: hithink-finance-cli live canary
on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 2 * * 1'
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    environment: hithink-finance-canary
    defaults:
      run:
        working-directory: hithink-finance-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts && npm run build
      - name: Run one bounded canary per hosted service
        shell: bash
        run: |
          mkdir -p canary
          node dist/cli/main.js symbol search --q 600519 --limit 1 --format json > canary/meta.json
          node dist/cli/main.js market snapshot --thscodes 600519.SH --limit 1 --format json > canary/a-share.json
          node dist/cli/main.js index snapshot --thscodes 000300.SH --format json > canary/index.json
          node -e "for (const f of ['meta','a-share','index']) { const x=require('./canary/'+f+'.json'); if (!x.ok || !x.meta.request_id) process.exit(1) }"
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hithink-finance-live-canary
          path: hithink-finance-cli/canary/*.json
          retention-days: 7
