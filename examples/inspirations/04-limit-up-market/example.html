const DPR=Math.min(window.devicePixelRatio||1,2);

for(let i=0;i<5;i++){const yy=m.t+priceH*i/4,val=max-(max-min)*i/4;c.strokeStyle=css("--line");c.beginPath();c.moveTo(m.l,yy);c.lineTo(w-m.r,yy);c.stroke();c.fillStyle=css("--muted");c.fillText(fmt(val,2),4,yy)}
const vmax=Math.max(...view.map(x=>x.volume||0),1);view.forEach((p,i)=>{const xx=x(i),up=p.close_price>=p.open_price,col=up?css("--up"):css("--down"),bw=Math.max(2,Math.min(12,step*.62));c.strokeStyle=col;c.fillStyle=col;c.beginPath();c.moveTo(xx,y(p.high_price));c.lineTo(xx,y(p.low_price));c.stroke();const top=y(Math.max(p.open_price,p.close_price)),bot=y(Math.min(p.open_price,p.close_price));c.fillRect(xx-bw/2,top,bw,Math.max(1,bot-top));const vh=(p.volume||0)/vmax*volH;c.globalAlpha=.38;c.fillRect(xx-bw/2,h-26-vh,bw,vh);c.globalAlpha=1});

[0,Math.floor((view.length-1)/2),view.length-1].forEach((i,k)=>{c.fillStyle=css("--muted");c.textAlign=k===0?"left":k===2?"right":"center";c.fillText(dateOf(view[i].date_ms),x(i),h-9)});c.textAlign="left";

function counts(day){const out={};Object.entries(day.boards||{}).forEach(([k,v])=>{const n=boardKeys[k]||Number(k.match(/\d+/)?.[0])||0,count=(v||[]).length;if(n&&count)out[n]=count});return out}
function renderLadder(){const max=Math.max(4,...D.ladder.flatMap(d=>Object.keys(counts(d)).map(Number)));$("#ladder").innerHTML=D.ladder.slice().reverse().map(d=>{const c=counts(d),top=Math.max(1,...Object.keys(c).map(Number));return "<div class=ladder-col tabindex=0 data-date="+esc(d.date)+" data-counts='"+esc(JSON.stringify(c))+"'><div class=ladder-stack>"+Array.from({length:max},(_,i)=>{const n=i+1;return "<i class='ladder-cell "+(n<=top&&c[n]?"hot":"")+"' title='"+n+" 板 · "+(c[n]||0)+" 只'></i>"}).join("")+"</div><span class=ladder-date>"+d.date.slice(5)+"</span></div>"}).join("");$$(".ladder-col").forEach(x=>{const show=()=>{const c=JSON.parse(x.dataset.counts),txt=Object.keys(c).sort((a,b)=>b-a).map(k=>k+" 板 "+c[k]+" 只").join(" · ")||"无连板记录";$("#ladderLive").innerHTML="<strong>"+x.dataset.date+"</strong> · "+txt};x.onmouseenter=show;x.onfocus=show})}
function renderPool(){const min=Number($("#boardFilter").value),rows=D.pool.filter(x=>(x.continue_day_cnt||0)>=min).sort((a,b)=>(b.continue_day_cnt-a.continue_day_cnt)||(b.seal_money-a.seal_money));$("#poolRows").innerHTML=rows.map(x=>"<tr><td><b>"+esc(x.name)+"</b><br><span class=tag>"+esc(x.thscode)+"</span></td><td class=up>"+esc(x.continue_day_text)+"</td><td>"+esc(x.limit_up_time)+"</td><td>"+fmt(x.last_price)+"</td><td>"+money(x.seal_money)+"</td><td>"+esc(x.limit_up_reason||"未返回")+"</td></tr>").join("")}
